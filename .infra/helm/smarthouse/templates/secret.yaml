apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smarthouse.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ include "smarthouse.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.db.auth.rootUsername | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.db.auth.rootPassword | quote }}
  MONGODB_URI: "mongodb://{{ .Values.db.auth.rootUsername }}:{{ .Values.db.auth.rootPassword }}@{{ include "smarthouse.fullname" . }}-db:27017/{{ .Values.db.auth.database }}?authSource=admin"
  JWT_SECRET: ""
  STRIPE_SECRET_KEY: ""
  CLIENT_URL: "http://localhost:4200"
  STRIPE_PRICE_BASIC: ""
  STRIPE_PRICE_PREMIUM_PLUS: ""
  STRIPE_PRICE_EXTENDED_PRO: ""
  IOT_INGEST_API_KEY: ""
  IOT_INGEST_USER_ID: ""
  MQTT_INGEST_ENABLED: "true"
  MQTT_INGEST_USER_ID: ""
  MQTT_URL: "mqtt://172.20.10.2:1883"
  MQTT_HOST: "172.20.10.2"
  MQTT_PORT: "1883"
  OPENAI_API_KEY: "{{ .Values.api.openaiApiKey | default "" }}"
