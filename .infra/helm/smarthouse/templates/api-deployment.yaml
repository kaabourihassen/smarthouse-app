apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smarthouse.fullname" . }}-api
  labels:
    app.kubernetes.io/name: {{ include "smarthouse.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "smarthouse.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "smarthouse.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: fix-uploads-permissions
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /usr/src/api/uploads && chmod -R 777 /usr/src/api/uploads"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: uploads-dir
              mountPath: /usr/src/api/uploads
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          command: ["npm", "run", "start:prod"]
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "smarthouse.fullname" . }}-config
            - secretRef:
                name: {{ include "smarthouse.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: uploads-dir
              mountPath: /usr/src/api/uploads
          readinessProbe:
            httpGet:
              path: /api/metrics
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/metrics
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: uploads-dir
          hostPath:
            path: /data/smarthouse-uploads
            type: DirectoryOrCreate
