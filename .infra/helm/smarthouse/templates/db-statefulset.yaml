apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "smarthouse.fullname" . }}-db
  labels:
    app.kubernetes.io/name: {{ include "smarthouse.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db
spec:
  serviceName: {{ include "smarthouse.fullname" . }}-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "smarthouse.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "smarthouse.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: db
    spec:
      containers:
        - name: mongodb
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          ports:
            - name: mongodb
              containerPort: {{ .Values.db.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "smarthouse.fullname" . }}-config
            - secretRef:
                name: {{ include "smarthouse.fullname" . }}-secrets
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  {{- if .Values.db.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.db.persistence.storageClass }}
        storageClassName: {{ .Values.db.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.db.persistence.size | quote }}
  {{- else }}
      volumes:
        - name: mongo-data
          emptyDir: {}
  {{- end }}
